<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">VCode — Folded Ribbon V</title>
  <desc id="desc">Two paper ribbons form a V with one fold at the bottom. The lighter left ribbon lies over the gray right ribbon.</desc>
  <rect x="80" y="80" width="864" height="864" rx="196" fill="#252628"/>
  <g id="mark">
    <!-- The right ribbon is underneath. Both strips share the bottom fold. -->
    <path fill="#B7B9B7" d="M640 280H788L586 752H438Z"/>
    <!-- The uninterrupted left ribbon covers the overlap at the bottom. -->
    <path fill="#E7E7E5" d="M236 280H384L586 752H438Z"/>
  </g>
</svg>
