name: Build macOS arm64

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-arm64-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and package Apple Silicon
    runs-on: macos-26
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Isolate application storage
        run: |
          printf '%s\n' \
            "XDG_STATE_HOME=$RUNNER_TEMP/vcode/state" \
            "XDG_CONFIG_HOME=$RUNNER_TEMP/vcode/config" \
            "XDG_DATA_HOME=$RUNNER_TEMP/vcode/data" \
            "XDG_CACHE_HOME=$RUNNER_TEMP/vcode/cache" >> "$GITHUB_ENV"

      - name: Set up arm64 Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22.22.2
          architecture: arm64
          cache: npm
          cache-dependency-path: Tools/TypeScript/package-lock.json

      - name: Verify toolchain
        run: |
          test "$(uname -m)" = arm64
          test "$(node -p 'process.arch')" = arm64
          xcodebuild -version
          /usr/bin/swift --version

      - name: Install language service
        run: npm ci --prefix Tools/TypeScript --ignore-scripts --registry=https://registry.npmjs.org --no-audit --no-fund

      - name: Run automated tests
        run: |
          mkdir -p .build/ci-results
          set -o pipefail
          /usr/bin/swift test 2>&1 | tee .build/ci-results/swift-test.log

      - name: Build app
        run: bash scripts/build.sh

      - name: Package and verify arm64 app
        run: bash scripts/package-macos.sh

      - name: Upload installable packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: VCode-macos-arm64-${{ github.sha }}
          path: |
            dist/VCode-macos-arm64.zip
            dist/VCode-macos-arm64.dmg
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload test log
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: test-log-macos-arm64-${{ github.sha }}
          path: .build/ci-results/swift-test.log
          if-no-files-found: ignore
          retention-days: 7

  publish-preview:
    name: Publish preview release
    needs: build
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download verified packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: VCode-macos-arm64-${{ github.sha }}
          path: release-assets

      - name: Create preview release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_TAG: preview-${{ github.run_number }}-${{ github.run_attempt }}
        run: |
          cd release-assets
          sha256sum --check SHA256SUMS.txt
          notes="$RUNNER_TEMP/vcode-release-notes.md"
          cat > "$notes" <<EOF
          Automated Apple Silicon preview from main.

          Commit: $RELEASE_SHA
          Build: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID

          Download the DMG and drag VCode into Applications, or extract the ZIP.
          The app includes arm64 Node.js and the TypeScript language service.
          This preview uses ad-hoc signing and is not notarized by Apple.
          EOF
          gh release create "$RELEASE_TAG" \
            VCode-macos-arm64.zip VCode-macos-arm64.dmg SHA256SUMS.txt \
            --target "$RELEASE_SHA" \
            --title "Preview $RELEASE_TAG (${RELEASE_SHA:0:7})" \
            --prerelease --latest=false \
            --notes-file "$notes"
          printf 'Preview release: %s/%s/releases/tag/%s\n' \
            "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$RELEASE_TAG" >> "$GITHUB_STEP_SUMMARY"
